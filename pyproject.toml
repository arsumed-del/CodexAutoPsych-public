[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexautopsych"
version = "0.1.0"
description = "Portable persistent research coordination with an offline synthetic runner"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codexautopsych = "codexautopsych.cli:main"

[tool.setuptools.packages.find]
include = ["codexautopsych*"]
